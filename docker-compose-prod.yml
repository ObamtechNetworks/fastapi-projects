services:

  api:
    image: devobams/fastapi-posts-backend:latest
    container_name: fastapi_app
    ports:
      - "80:8000"
    depends_on:
      - db
    env_file:
      - .env
    restart: always

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: